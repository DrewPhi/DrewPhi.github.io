<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#222624" />
  <meta name="description" content="Download the DrewCraft launcher for Windows or macOS." />
  <title>DrewCraft</title>

  <style>
    :root {
      --bg: #222624;
      --bg-deep: #171a18;
      --ink: #ffffff;
      --muted: #b9c0b9;
      --yellow: #faff75;
      --yellow-soft: #f9fbb1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 320px;
      min-height: 100%;
      background: var(--bg-deep);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background:
        radial-gradient(circle at 50% 38%, rgba(250,255,117,.08), transparent 34rem),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    }

    main {
      width: min(900px, calc(100% - 28px));
      padding: 64px 0;
      text-align: center;
    }

    .tag {
      margin: 0 0 22px;
      color: var(--yellow-soft);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .04em;
      font-size: clamp(64px, 13vw, 136px);
      line-height: .9;
      letter-spacing: -.08em;
      font-weight: 950;
      color: white;
    }

    .drew {
      display: inline-block;
      color: var(--yellow);
      transform-origin: 50% 52%;
      animation: sputter-spin 3.6s infinite;
      will-change: transform;
      text-shadow: 0 0 26px rgba(250,255,117,.13);
    }

    @keyframes sputter-spin {
      0%   { transform: rotate(0deg); }
      10%  { transform: rotate(185deg); }
      13%  { transform: rotate(192deg); }
      22%  { transform: rotate(420deg); }
      27%  { transform: rotate(486deg); }
      31%  { transform: rotate(493deg); }
      46%  { transform: rotate(850deg); }
      50%  { transform: rotate(858deg); }
      68%  { transform: rotate(1265deg); }
      73%  { transform: rotate(1280deg); }
      77%  { transform: rotate(1287deg); }
      100% { transform: rotate(1800deg); }
    }

    .lede {
      max-width: 620px;
      margin: 34px auto 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 19px);
      line-height: 1.65;
    }

    .downloads {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      width: min(680px, 100%);
      margin: 38px auto 0;
    }

    .download {
      min-width: 0;
      min-height: 104px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      color: var(--bg-deep);
      background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-soft) 62%, #fff 125%);
      text-decoration: none;
      text-align: left;
      box-shadow: 0 18px 42px rgba(0,0,0,.28);
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }

    .download:hover,
    .download:focus-visible {
      transform: translateY(-4px);
      filter: brightness(1.04);
      box-shadow: 0 24px 52px rgba(0,0,0,.34);
      outline: 2px solid white;
      outline-offset: 3px;
    }

    .download small {
      margin-bottom: 6px;
      color: rgba(23,26,24,.58);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .download strong {
      font-size: clamp(18px, 3vw, 28px);
      line-height: 1;
      letter-spacing: -.035em;
    }

    .note {
      margin: 22px 0 0;
      color: rgba(255,255,255,.43);
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      main { padding: 44px 0; }
      .tag { margin-bottom: 18px; font-size: 10px; }
      h1 { font-size: clamp(54px, 18vw, 78px); }
      .lede { margin-top: 26px; font-size: 14px; }
      .downloads { gap: 9px; margin-top: 30px; }
      .download { min-height: 88px; padding: 14px 11px; }
      .download small { font-size: 7px; letter-spacing: .1em; }
      .download strong { font-size: clamp(14px, 4.5vw, 19px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .drew { animation: none; }
      .download { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">Private modded Minecraft</p>

    <h1 aria-label="DrewCraft">
      <span class="drew" aria-hidden="true">Drew</span><span>Craft</span>
    </h1>

    <p class="lede">One installer. No mod juggling, Java setup, or version matching. Download DrewCraft and launch the world.</p>

    <section class="downloads" aria-label="Download DrewCraft">
      <a class="download" href="https://github.com/DrewPhi/ServerMc/releases/latest/download/DrewCraft-Windows.exe">
        <small>Download for</small>
        <strong>Windows</strong>
      </a>

      <a class="download" href="https://github.com/DrewPhi/ServerMc/releases/latest/download/DrewCraft-macOS.dmg">
        <small>Download for</small>
        <strong>macOS</strong>
      </a>
    </section>

    <p class="note">Install once. Updates are handled automatically.</p>
  </main>
</body>
</html>
