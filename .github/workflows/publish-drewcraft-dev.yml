name: Publish DrewCraft local dev build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-drewcraft-dev.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DEV_PAYLOAD_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-2c7c-81f5-b6bb-64eae4628439/raw?se=2026-09-13T03%3A18%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=cc418b29-9159-51c0-b654-9e2e5b67da88&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T00%3A06%3A48Z&ske=2026-09-14T00%3A06%3A48Z&sks=b&skv=2026-02-06&sig=Tz5YhBXHmSBfYzk3iLMJFLfjBn5OqHToKsRKrD/wcw8%3D"
      WINDOWS_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-3bb4-81f5-b31e-2b02748268ec/raw?se=2026-09-13T03%3A18%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=76228ee9-2cff-5b0b-b008-89288c838721&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T00%3A21%3A42Z&ske=2026-09-14T00%3A21%3A42Z&sks=b&skv=2026-02-06&sig=9uDTxKCnW2%2Bb6eFoz/X1w7%2B2odWg3t8baD3IZn6UgKk%3D"
      MACOS_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-95e0-81f5-87f1-818f34fa226b/raw?se=2026-09-13T03%3A18%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=641e2c08-c763-5e5a-8b60-dd23b81f486f&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T00%3A21%3A23Z&ske=2026-09-14T00%3A21%3A23Z&sks=b&skv=2026-02-06&sig=ESCChVu7ycF54hQRUeIJAMh3ViTVZ4bkjswSzrDpF7U%3D"
    steps:
      - name: Checkout published Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - name: Download exact tested DrewCraft artifacts
        run: |
          set -euo pipefail
          curl -fL "$DEV_PAYLOAD_URL" -o /tmp/dev.zip
          curl -fL "$WINDOWS_URL" -o /tmp/windows.zip
          curl -fL "$MACOS_URL" -o /tmp/macos.zip
          mkdir -p /tmp/dev /tmp/windows /tmp/macos
          unzip -q /tmp/dev.zip -d /tmp/dev
          unzip -q /tmp/windows.zip -d /tmp/windows
          unzip -q /tmp/macos.zip -d /tmp/macos
          test -f /tmp/dev/live.json
          test -f /tmp/dev/0.1.0-dev-local/release-manifest.json
          test -f /tmp/windows/DrewCraft-Windows.exe
          test -f /tmp/macos/DrewCraft-macOS.dmg
          (cd /tmp/dev && sha256sum -c SHA256SUMS)
          test "$(stat -c%s /tmp/dev/0.1.0-dev-local/common/mods/terrain-diffusion-mc-neoforge-1.21.1-2.3.0-cpu.jar)" = "93968726"
          test "$(stat -c%s /tmp/windows/DrewCraft-Windows.exe)" = "11958718"
          test "$(stat -c%s /tmp/macos/DrewCraft-macOS.dmg)" = "12116641"

      - name: Publish anonymous dev payload and launchers
        run: |
          set -euo pipefail
          rm -rf site/DrewCraft/dev site/DrewCraft/downloads
          mkdir -p site/DrewCraft/dev/releases site/DrewCraft/downloads
          cp -a /tmp/dev/0.1.0-dev-local site/DrewCraft/dev/releases/
          cp /tmp/dev/live.json site/DrewCraft/live.json
          cp /tmp/dev/SHA256SUMS site/DrewCraft/dev/SHA256SUMS
          cp /tmp/windows/DrewCraft-Windows.exe site/DrewCraft/downloads/DrewCraft-Windows.exe
          cp /tmp/macos/DrewCraft-macOS.dmg site/DrewCraft/downloads/DrewCraft-macOS.dmg
          python - <<'PY'
          from pathlib import Path
          p = Path('site/DrewCraft/index.html')
          s = p.read_text('utf-8')
          s = s.replace('https://github.com/DrewPhi/ServerMc/releases/latest/download/DrewCraft-Windows.exe', './downloads/DrewCraft-Windows.exe')
          s = s.replace('https://github.com/DrewPhi/ServerMc/releases/latest/download/DrewCraft-macOS.dmg', './downloads/DrewCraft-macOS.dmg')
          s = s.replace('Java, mods, configs, and updates are handled automatically.', 'Development build · local single-player testing · Java, mods, configs, and updates are handled automatically.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit to gh-pages
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DrewCraft
          git status --short
          git commit -m "Publish DrewCraft local dev launcher" || exit 0
          git push origin gh-pages
