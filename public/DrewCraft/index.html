<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171a18" />
  <meta name="description" content="Download the DrewCraft launcher for Windows or macOS." />
  <title>DrewCraft</title>

  <style>
    :root {
      --bg: #171a18;
      --bg-top: #232824;
      --text: #ffffff;
      --muted: #b9c0b9;
      --yellow: #faff75;
      --yellow-soft: #f9fbb1;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      min-width: 320px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background:
        radial-gradient(circle at 50% 32%, rgba(250,255,117,.08), transparent 34rem),
        linear-gradient(180deg, var(--bg-top), var(--bg));
    }

    main {
      width: min(760px, calc(100% - 28px));
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding:
        max(18px, env(safe-area-inset-top))
        0
        max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--yellow-soft);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .035em;
      font-size: clamp(64px, 13vw, 132px);
      line-height: .86;
      letter-spacing: -.085em;
      font-weight: 950;
      white-space: nowrap;
    }

    .drew {
      display: inline-block;
      color: var(--yellow);
      transform-origin: 50% 52%;
      animation: sputter-spin 3.6s infinite;
      will-change: transform;
      text-shadow: 0 0 28px rgba(250,255,117,.12);
    }

    @keyframes sputter-spin {
      0%   { transform: rotate(0deg); }
      10%  { transform: rotate(185deg); }
      13%  { transform: rotate(192deg); }
      22%  { transform: rotate(420deg); }
      27%  { transform: rotate(486deg); }
      31%  { transform: rotate(493deg); }
      46%  { transform: rotate(850deg); }
      50%  { transform: rotate(858deg); }
      68%  { transform: rotate(1265deg); }
      73%  { transform: rotate(1280deg); }
      77%  { transform: rotate(1287deg); }
      100% { transform: rotate(1800deg); }
    }

    .summary {
      max-width: 620px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(14px, 2vw, 18px);
      line-height: 1.6;
      text-wrap: balance;
    }

    .downloads {
      width: min(640px, 100%);
      margin-top: 38px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .download {
      min-width: 0;
      min-height: 112px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      color: #171a18;
      background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-soft) 62%, #fff 130%);
      text-decoration: none;
      text-align: left;
      box-shadow: 0 18px 42px rgba(0,0,0,.28);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }

    .download:hover,
    .download:focus-visible {
      transform: translateY(-3px);
      filter: brightness(1.035);
      box-shadow: 0 24px 52px rgba(0,0,0,.34);
      outline: 2px solid white;
      outline-offset: 3px;
    }

    .download small {
      margin-bottom: 7px;
      color: rgba(23,26,24,.58);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .download strong {
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1;
      letter-spacing: -.035em;
    }

    .note {
      margin: 18px 0 0;
      color: rgba(255,255,255,.42);
      font-size: 10px;
      line-height: 1.4;
    }

    @media (max-width: 520px) {
      main {
        width: calc(100% - 18px);
        padding-top: max(12px, env(safe-area-inset-top));
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }

      .eyebrow {
        margin-bottom: 12px;
        font-size: 8px;
      }

      h1 {
        font-size: clamp(48px, 18vw, 76px);
      }

      .summary {
        margin-top: 20px;
        max-width: 34rem;
        font-size: clamp(12px, 3.2vw, 14px);
        line-height: 1.45;
      }

      .downloads {
        margin-top: 28px;
        gap: 9px;
      }

      .download {
        min-height: 92px;
        padding: 14px 11px;
      }

      .download small {
        margin-bottom: 5px;
        font-size: 7px;
        letter-spacing: .1em;
      }

      .download strong {
        font-size: clamp(15px, 5vw, 19px);
      }

      .note {
        margin-top: 13px;
        font-size: 8px;
      }
    }

    @media (max-height: 560px) {
      .eyebrow,
      .note { display: none; }

      h1 {
        font-size: clamp(44px, min(10vw, 16vh), 80px);
      }

      .summary {
        margin-top: 14px;
        font-size: clamp(10px, 1.8vw, 13px);
        line-height: 1.35;
      }

      .downloads {
        margin-top: 20px;
      }

      .download {
        min-height: 72px;
        padding: 10px 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .drew { animation: none; }
      .download { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Private modded Minecraft</p>

    <h1 aria-label="DrewCraft">
      <span class="drew" aria-hidden="true">Drew</span><span>Craft</span>
    </h1>

    <p class="summary">A huge, weather-beaten survival world built for journeys, machines, aircraft, danger, and friends.</p>

    <section class="downloads" aria-label="Download DrewCraft">
      <a class="download" href="./downloads/DrewCraft-Windows.exe">
        <small>Download for</small>
        <strong>Windows</strong>
      </a>

      <a class="download" href="./downloads/DrewCraft-macOS.dmg">
        <small>Download for</small>
        <strong>macOS</strong>
      </a>
    </section>

    <p class="note">Development build · local single-player testing · Java, mods, configs, and updates are handled automatically.</p>
  </main>
</body>
</html>
