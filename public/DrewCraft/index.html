<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#222624" />
  <meta name="description" content="DrewCraft — one-click Minecraft server install for Windows and macOS." />
  <title>DrewCraft</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      font-family: "Source Code Pro", monospace;
      color: rgba(255, 255, 255, 0.87);
      background: rgb(34, 38, 36);
      --color-primary: rgb(255, 255, 255);
      --color-secondary: rgb(250, 255, 117);
      --color-secondary-soft: rgb(249, 251, 177);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100%;
      background: rgb(34, 38, 36);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    #flow-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: rgb(34, 38, 36);
    }

    #flow-bg canvas {
      position: absolute !important;
      inset: 0 !important;
      z-index: 0 !important;
      width: 100% !important;
      height: 100% !important;
      pointer-events: none !important;
    }

    .page-shell {
      position: relative;
      z-index: 10;
      min-height: 100vh;
    }

    .site-nav {
      position: fixed;
      top: 2%;
      left: 20%;
      width: min(34rem, 48vw);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1rem;
      border-top: solid 3px;
      border-image: linear-gradient(to left, rgb(248, 248, 248), rgb(242, 255, 122)) 1;
      z-index: 20;
    }

    .site-nav a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      text-shadow: 2px 2px 4px black;
      transition: opacity 160ms ease;
    }

    .site-nav a:first-child { opacity: 0.55; }

    .site-nav a:hover,
    .site-nav a:focus-visible { opacity: 1; }

    main {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      width: min(70rem, calc(100% - 3rem));
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 8rem 0 5rem;
    }

    .hero {
      width: min(56rem, 100%);
      margin-left: clamp(0rem, 7vw, 7rem);
      text-align: left;
    }

    .eyebrow {
      margin: 0 0 0.45rem;
      color: var(--color-secondary-soft);
      font-size: clamp(1rem, 1.8vw, 1.45rem);
      font-weight: 700;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    h1 {
      margin: 0;
      color: var(--color-primary);
      font-size: clamp(4rem, 9vw, 7.5rem);
      line-height: 0.94;
      letter-spacing: -0.07em;
      font-weight: 700;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    .subtitle {
      max-width: 45rem;
      margin: 1.25rem 0 0;
      color: white;
      font-size: clamp(1rem, 1.8vw, 1.35rem);
      line-height: 1.65;
      font-weight: 600;
      text-shadow: 1px 1px 3px black;
    }

    .downloads {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      width: min(42rem, 100%);
      margin-top: 2.4rem;
    }

    .download {
      position: relative;
      min-width: 0;
      min-height: 5.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.1rem 1.3rem;
      color: rgb(34, 38, 36);
      background: linear-gradient(135deg, rgb(242, 255, 122) 0%, rgb(250, 255, 117) 45%, rgb(255, 255, 255) 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      text-decoration: none;
      box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.3);
      transition: transform 150ms ease, filter 150ms ease;
      overflow: hidden;
    }

    .download:hover,
    .download:focus-visible {
      transform: translateY(-3px);
      filter: brightness(1.05);
      outline: 2px solid white;
      outline-offset: 2px;
    }

    .download strong {
      color: rgb(34, 38, 36);
      font-size: 1.08rem;
      line-height: 1.25;
      font-weight: 700;
    }

    .download span {
      margin-top: 0.28rem;
      color: rgba(34, 38, 36, 0.72);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .note {
      margin: 1.4rem 0 0;
      color: rgba(255, 255, 255, 0.62);
      font-size: 0.8rem;
      font-weight: 600;
      text-shadow: 1px 1px 2px black;
    }

    @media (max-width: 768px) {
      .site-nav {
        top: 2%;
        left: 0;
        width: 100%;
        padding: 0.8rem 1.2rem;
      }

      .site-nav a { font-size: 0.78rem; }

      main {
        width: min(100% - 2rem, 42rem);
        padding-top: 7rem;
      }

      .hero { margin-left: 0; }
      .eyebrow { font-size: 1rem; }
      h1 { font-size: clamp(3.8rem, 19vw, 6rem); }
      .subtitle { font-size: 1rem; }

      .downloads {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
      }

      .download {
        min-height: 4.75rem;
        padding: 0.85rem 0.7rem;
      }

      .download strong { font-size: clamp(0.72rem, 3.2vw, 0.95rem); }
      .download span { font-size: clamp(0.6rem, 2.4vw, 0.72rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div id="flow-bg" aria-hidden="true"></div>

  <div class="page-shell">
    <nav class="site-nav" aria-label="Site navigation">
      <a href="/">Drew Steindl</a>
      <a href="/DrewCraft/" aria-current="page">DrewCraft</a>
    </nav>

    <main>
      <section class="hero" aria-labelledby="drewcraft-title">
        <p class="eyebrow">Minecraft, without the setup.</p>
        <h1 id="drewcraft-title">DrewCraft</h1>
        <p class="subtitle">One-click install. The launcher handles Minecraft, Java, mods, configs, and updates for you.</p>

        <div class="downloads">
          <a class="download" href="https://github.com/DrewPhi/ServerMc/releases/latest/download/DrewCraft-Windows.exe">
            <strong>Download for Windows</strong>
            <span>.exe installer</span>
          </a>
          <a class="download" href="https://github.com/DrewPhi/ServerMc/releases/latest/download/DrewCraft-macOS.dmg">
            <strong>Download for Mac</strong>
            <span>.dmg installer</span>
          </a>
        </div>

        <p class="note">Install it, launch it, and play. Updates are handled automatically.</p>
      </section>
    </main>
  </div>

  <script src="./background.js"></script>
</body>
</html>
